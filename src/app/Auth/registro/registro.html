


  <div >
    <div class="auth-box">
      
      <!-- Header del formulario -->
      <div class="auth-header">
        <div class="auth-logo">
          <span class="logo-icon">◉</span> STUDIO<span class="accent">PRO</span>
        </div>
        <div class="auth-led"></div>
      </div>
      
      <h2 class="auth-title">CREAR CUENTA</h2>
      <p class="auth-subtitle">Únete al mundo del audio profesional</p>
      
      <!-- Formulario -->
      <form class="auth-form">
        
        <div class="form-group">
          <label for="nombre">NOMBRE</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>
        
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="usuario">USUARIO</label>
          <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
        </div>
        
        <div class="form-group">
          <label for="password">CONTRASEÑA</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
          <label for="confirmar">CONFIRMAR CONTRASEÑA</label>
          <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="••••••••" required>
        </div>
        
        <div class="form-group checkbox-group">
          <input type="checkbox" id="terminos" required>
          <label for="terminos">Acepto los <a href="#">Términos y Condiciones</a></label>
        </div>
        
        <button type="submit" class="btn-register">REGISTRARSE</button>
        
      </form>

      <button type="submit" routerLink="/inicio" class="btn-register">volver al inicio</button>
      
      <!-- Footer -->
      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a href="#">Iniciar sesión</a></p>
      </div>
      
    </div>
  </div>
